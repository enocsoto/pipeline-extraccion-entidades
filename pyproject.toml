[project]
name = "pipeline-extraccion-entidades"
version = "0.1.0"
description = "Pipeline de extracción de entidades técnicas con LCEL y reintentos."
requires-python = ">=3.12"
dependencies = [
    "langchain-openai",
    "langchain-anthropic",
    "pydantic",
    "python-dotenv",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["schemas", "chain", "main"]
